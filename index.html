<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calacutayo</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }

        body {
            background-color: #000;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            user-select: none;
            cursor: pointer;
        }

        #calc-container {
            background: #1a1a1a;
            padding: 30px;
            border-radius: 45px;
            box-shadow: 0 40px 80px rgba(0,0,0,0.9);
            width: 350px;
            transition: opacity 1s ease; 
            cursor: default;
        }

        #display {
            width: 100%;
            height: 90px;
            color: #fff;
            font-size: 2.2rem;
            text-align: right;
            padding: 10px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            word-break: break-all;
            overflow: hidden;
        }

        .button-layout {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        button {
            border: none;
            height: 65px;
            width: 65px;
            border-radius: 50%;
            background: #2a2a2a;
            color: #fff;
            font-size: 1.3rem;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(0,0,0,0.5), inset 0 2px 4px rgba(255,255,255,0.05);
        }

        button:active { transform: scale(0.9); }
        .oval { grid-column: span 2; width: 145px; border-radius: 50px; }
        .op { background: #333; color: #fff; }
        .func { background: #444; color: #fff; }

        #void-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: black;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .no-click { pointer-events: none; }

        #zoom-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #void-text {
            font-size: 2rem;
            font-weight: 600;
            text-align: center;
            width: 90%;
            opacity: 0;
            line-height: 1.3;
            color: white;
            display: inline-block;
        }

        #matt-name {
            position: absolute;
            bottom: 25%;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            opacity: 0; 
            font-size: 1.2rem;
            font-weight: 300;
            letter-spacing: 2px;
        }

        .name-fade-in { animation: mattFade 1s ease forwards; }

        @keyframes mattFade {
            0% { opacity: 0; }
            100% { opacity: 0.5; }
        }

        .red-text { color: #ff4d4d !important; text-shadow: 0 0 15px rgba(255, 77, 77, 0.6); }

        .zoom-layer { animation: continuousZoom 15s linear forwards; }
        .relapse-entry { animation: blurFadeIn 1s ease-out forwards; }
        .relapse-exit { animation: blurFadeOut 0.5s ease-in forwards; }
        .relapse-exit-final { animation: blurFadeOut 1s ease-in forwards; }

        @keyframes blurFadeIn {
            0% { opacity: 0; filter: blur(15px); }
            100% { opacity: 1; filter: blur(0px); }
        }

        @keyframes continuousZoom {
            0% { transform: scale(1); }
            100% { transform: scale(1.5); }
        }

        @keyframes blurFadeOut {
            0% { opacity: 1; filter: blur(0px); }
            100% { opacity: 0; filter: blur(20px); }
        }

        .plot-twist-fade-in { animation: simpleFadeIn 5s ease-in-out forwards; }

        @keyframes simpleFadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <audio id="bg-music" preload="auto">
        <source src="bulong.mp3" type="audio/mpeg">
    </audio>

    <div id="calc-container">
        <div id="display">0</div>
        <div class="button-layout">
            <button class="func" onclick="clearDisplay(event)">AC</button>
            <button class="func" onclick="appendNum('(', event)">(</button>
            <button class="func" onclick="appendNum(')', event)">)</button>
            <button class="op" onclick="appendNum('/', event)">÷</button>
            
            <button onclick="appendNum('7', event)">7</button>
            <button onclick="appendNum('8', event)">8</button>
            <button onclick="appendNum('9', event)">9</button>
            <button class="op" onclick="appendNum('*', event)">×</button>
            
            <button onclick="appendNum('4', event)">4</button>
            <button onclick="appendNum('5', event)">5</button>
            <button onclick="appendNum('6', event)">6</button>
            <button class="op" onclick="appendNum('-', event)">-</button>
            
            <button onclick="appendNum('1', event)">1</button>
            <button onclick="appendNum('2', event)">2</button>
            <button onclick="appendNum('3', event)">3</button>
            <button class="op" onclick="appendNum('+', event)">+</button>
            
            <button class="oval" onclick="appendNum('0', event)">0</button>
            <button onclick="appendNum('.', event)">.</button>
            <button class="op" onclick="startSequence(event)">=</button>
        </div>
    </div>

    <div id="void-overlay">
        <div id="zoom-wrapper">
            <div id="void-text"></div>
        </div>
        <div id="matt-name">MATT</div>
    </div>

    <script>
        // --- ANTI-SNOOP SECURITY WALL ---
        document.addEventListener('contextmenu', event => event.preventDefault());

        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'j') {
                location.reload(); 
                return; 
            }
            if (e.key === 'F12' || e.keyCode === 123) {
                e.preventDefault(); return;
            }
            if (e.ctrlKey || e.metaKey) {
                const k = e.key.toLowerCase();
                if (k === 'u' || k === 's' || k === 'p' || (e.shiftKey && k === 'i') || (e.shiftKey && k === 'c')) {
                    e.preventDefault(); return;
                }
            }
        });
        // --- END SECURITY WALL ---

        const display = document.getElementById('display');
        const calcContainer = document.getElementById('calc-container');
        const overlay = document.getElementById('void-overlay');
        const textField = document.getElementById('void-text');
        const zoomWrapper = document.getElementById('zoom-wrapper');
        const mattName = document.getElementById('matt-name');
        const bgMusic = document.getElementById('bg-music');

        let appState = "CALC"; 
        let currentStep = 0;
        let isTransitioning = false;

        // Base64 Scrambled Lyrics
        const messages = [
            { text: atob("UWFtYW1hdGF5IGFrb25n... wait, I mean: QWtvJ3kgYWxpcGluIG5nIHBhZy1pYmlnIG1v"), duration: 6000 },
            { text: atob("QWtvJ3kgYWxpcGluIG5nIHBhZy1pYmlnIG1v"), duration: 6000 },
            { text: atob("SGFuZGFuZyBpYmlnaW4gYW5nIDxzcGFuIGNsYXNzPSdyZWQtdGV4dCc+aXNhbmcgdHVsYWQgbW88L3NwYW4+"), duration: 6500 },
            { text: atob("SGFuZ2dhdCBhbmcgPHNwYW4gY2xhc3M9J3JlZC10ZXh0Jz5QdXNvPC9zcGFuPiBtbyd5"), duration: 2600 },
            { text: atob("PHNwYW4gY2xhc3M9J3JlZC10ZXh0Jz5TYSBha2luIGxhbmc8L3NwYW4+"), duration: 1400 },
            { text: atob("SGluZGkga2FuYQ=="), duration: 1400 },
            { text: atob("PHNwYW4gY2xhc3M9J3JlZC10ZXh0Jz5NYWxpbGlubGFuZzwvc3Bhbj4="), duration: 1400 },
            { text: atob("SWthdyBhbmcgPHNwYW4gY2xhc3M9J3JlZC10ZXh0Jz5pbGF3PC9zcGFuPiBzYSA8c3BhbiBjbGFzcz0ncmVkLXRleHQnPmRpbGltPC9zcGFuPg=="), duration: 2700 },
            { text: atob("PHNwYW4gY2xhc3M9J3JlZC10ZXh0Jz5BdCBhbmcgbGl3YW5hZzwvc3Bhbj4="), duration: 1700 },
            { text: atob("PHNwYW4gY2xhc3M9J3JlZC10ZXh0Jz5OZyBtZ2EgYml0dWluPC9zcGFuPg=="), duration: 5800 }
        ];
        
        // Remove the accidental duplicate first entry that happened during encoding logic above:
        messages.shift();

        function appendNum(char, event) {
            event.stopPropagation();
            if (display.innerText === "Error" || display.innerText === atob("TmFna2FtYWxpIGJhIGFrbz8=") || display.innerText === "Calculating...") {
                display.innerText = "";
                display.style.color = "#fff";
            }
            if (display.innerText === '0' && char !== '.') {
                display.innerText = char;
            } else {
                display.innerText += char;
            }
        }

        function clearDisplay(event) {
            event.stopPropagation();
            if(isTransitioning) return;
            display.innerText = '0';
            display.style.color = "#fff";
            appState = "CALC";
        }

        function startSequence(event) {
            event.stopPropagation();
            if (isTransitioning) return;
            if (display.innerText === "Error") return;

            let userInput = display.innerText;
            let isValid = false;

            try {
                if (!userInput || userInput === "0") throw new Error("Empty");
                eval(userInput);
                if (['+', '-', '*', '/'].includes(userInput.slice(-1))) {
                    throw new Error("Trailing operator");
                }
                isValid = true; 
            } catch (e) {
                isValid = false;
            }

            if (!isValid) {
                display.innerText = "Error";
                display.style.color = "#ff4d4d";
                return; 
            }

            // --- THE FAKE CALCULATION DELAY ---
            isTransitioning = true;
            display.innerText = "Calculating...";
            display.style.color = "#a0a0ab";

            setTimeout(() => {
                // The Plot Twist kicks in here
                display.innerText = atob("TmFna2FtYWxpIGJhIGFrbz8="); // Nagkamali ba ako?
                display.style.color = "#ff4d4d";

                // Prime Audio (Required for mobile browsers)
                bgMusic.muted = true;
                bgMusic.play().then(() => {
                    bgMusic.pause();
                    bgMusic.muted = false;
                    startAudioFade();
                }).catch(e => {
                    bgMusic.muted = false;
                    startAudioFade();
                });

                function startAudioFade() {
                    bgMusic.currentTime = 183;
                    bgMusic.volume = 0;
                    bgMusic.play();

                    let vol = 0;
                    const fadeInInterval = setInterval(() => {
                        if (vol < 1) {
                            vol += 0.05; 
                            bgMusic.volume = Math.min(vol, 1);
                        } else {
                            clearInterval(fadeInInterval);
                        }
                    }, 50); 
                }

                // Fade out the calculator
                calcContainer.style.opacity = '0';
                
                setTimeout(() => {
                    calcContainer.style.display = 'none';
                    overlay.style.display = 'flex';
                    overlay.classList.add('no-click');
                    mattName.classList.add('name-fade-in');
                    
                    setTimeout(() => {
                        appState = "RELAPSING";
                        runAutomatedLyrics();
                    }, 3000);
                }, 1000); 

            }, 2000); // Waits exactly 2 seconds pretending to calculate!
        }

        function runAutomatedLyrics() {
            if (currentStep < messages.length) {
                renderMessage(messages[currentStep].text);
                
                setTimeout(() => {
                    const isFinal = currentStep === messages.length - 1;
                    textField.classList.remove('relapse-entry');
                    textField.classList.add(isFinal ? 'relapse-exit-final' : 'relapse-exit');

                    const transitionDelay = isFinal ? 1000 : 500;

                    setTimeout(() => {
                        currentStep++;
                        if (currentStep < messages.length) {
                            runAutomatedLyrics();
                        } else {
                            showPlotTwist();
                        }
                    }, transitionDelay); 

                }, messages[currentStep].duration);
            }
        }

        function renderMessage(content) {
            zoomWrapper.classList.remove('zoom-layer');
            void zoomWrapper.offsetWidth; 
            zoomWrapper.classList.add('zoom-layer');

            textField.classList.remove('relapse-exit', 'relapse-entry', 'relapse-exit-final', 'plot-twist-fade-in');
            textField.innerHTML = content;
            void textField.offsetWidth; 
            textField.classList.add('relapse-entry');
        }

        function showPlotTwist() {
            zoomWrapper.classList.remove('zoom-layer');
            textField.classList.remove('relapse-exit', 'relapse-entry', 'relapse-exit-final');
            // Base64 for "Aray mo Pakak!"
            textField.innerHTML = atob("PHNwYW4gY2xhc3M9J3JlZC10ZXh0Jz5BcmF5IG1vIFBha2FrITwvc3Bhbj4=");
            void textField.offsetWidth;
            textField.classList.add('plot-twist-fade-in'); 
        }
    </script>
</body>
</html>
