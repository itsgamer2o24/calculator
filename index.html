<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    
    <link rel="icon" href="https://upload.wikimedia.org/wikipedia/en/3/36/December_Avenue_-_December_Avenue.jpg">
    
    <meta property="og:title" content="Calculator">
    <meta property="og:description" content="A simple, clean web calculator.">
    <meta property="og:image" content="https://upload.wikimedia.org/wikipedia/en/3/36/December_Avenue_-_December_Avenue.jpg">
    <meta property="og:type" content="website">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            -webkit-tap-highlight-color: transparent; outline: none;
        }

        body {
            background-color: #050505; height: 100vh;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; user-select: none;
        }

        /* --- HIGH-END ROTATING BACKGROUND --- */
        .bg-mesh {
            position: fixed; top: -50vh; left: -50vw; width: 200vw; height: 200vh;
            z-index: -1; background: #050505; overflow: hidden;
            animation: spinMesh 45s linear infinite;
        }
        @keyframes spinMesh { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .orb {
            position: absolute; border-radius: 50%; filter: blur(100px); 
            opacity: 0.5; animation: pulseOrb 12s infinite alternate ease-in-out;
        }
        .orb-1 { width: 70vw; height: 70vw; background: #1c2b59; top: 10%; left: 10%; }
        .orb-2 { width: 60vw; height: 60vw; background: #4a154b; bottom: 10%; right: 10%; animation-delay: -4s; }
        .orb-3 { width: 50vw; height: 50vw; background: #8a3a0e; top: 30%; left: 30%; animation-delay: -8s; }
        @keyframes pulseOrb { 0% { transform: scale(1); opacity: 0.4; } 100% { transform: scale(1.3); opacity: 0.7; } }

        /* --- THE GLASSMORPHIC CALCULATOR --- */
        #calc-container {
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(60px); -webkit-backdrop-filter: blur(60px);
            padding: 40px 25px; border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 50px 100px rgba(0,0,0,0.9), inset 0 1px 1px rgba(255,255,255,0.1);
            width: 370px; z-index: 10;
            transition: all 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        #display {
            width: 100%; height: 120px; color: #fff;
            font-size: 5rem; font-weight: 200; text-align: right;
            padding: 0 10px; margin-bottom: 25px;
            display: flex; align-items: flex-end; justify-content: flex-end;
            overflow: hidden; letter-spacing: -3px;
            transition: font-size 0.2s ease; white-space: nowrap;
        }

        .button-layout { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
        button {
            border: none; height: 72px; width: 100%; border-radius: 36px;
            font-size: 1.8rem; font-weight: 400; cursor: pointer;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex; justify-content: center; align-items: center;
            background: rgba(255, 255, 255, 0.08); color: #fff;
        }
        button:active { transform: scale(0.9); background: rgba(255, 255, 255, 0.2); }
        .func { background: rgba(255, 255, 255, 0.15); font-size: 1.5rem; font-weight: 500; }
        .op { background: #FF9F0A; box-shadow: 0 10px 20px rgba(255, 159, 10, 0.2); }
        .oval { grid-column: span 2; justify-content: flex-start; padding-left: 30px; border-radius: 40px; }

        /* --- CINEMATIC MUSIC PLAYER OVERLAY --- */
        #void-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.65); backdrop-filter: blur(40px);
            display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 999;
        }

        #bg-video {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: -1; filter: blur(25px) brightness(0.3);
        }

        #zoom-wrapper { width: 100%; display: flex; justify-content: center; align-items: center; margin-bottom: 100px; }
        
        #void-text {
            font-size: 2.4rem; font-weight: 500; text-align: center; width: 90%;
            opacity: 0; line-height: 1.4; color: #fff; letter-spacing: -0.5px;
            transition: transform 0.5s ease-out;
        }

        /* ZOOM ANIMATION FOR THE PLOT TWIST */
        .zoom-impact { animation: impactZoom 2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes impactZoom {
            0% { transform: scale(0.5); opacity: 0; filter: blur(10px); }
            50% { transform: scale(1.2); opacity: 1; filter: blur(0px); }
            100% { transform: scale(1); opacity: 1; }
        }

        /* --- MUSIC GUI --- */
        #music-gui {
            position: absolute; bottom: 50px; width: 85%; max-width: 400px;
            display: flex; flex-direction: column; gap: 18px; opacity: 0; transition: opacity 2s ease;
        }
        .gui-header { display: flex; align-items: center; gap: 18px; }
        .album-art {
            width: 60px; height: 60px; border-radius: 50%;
            background: url('https://upload.wikimedia.org/wikipedia/en/3/36/December_Avenue_-_December_Avenue.jpg') center/cover;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 2px solid rgba(255,255,255,0.1);
            animation: spinArt 5s linear infinite;
        }
        @keyframes spinArt { 100% { transform: rotate(360deg); } }
        .track-title { color: #fff; font-weight: 600; font-size: 1.2rem; }
        .track-artist { color: rgba(255,255,255,0.5); font-size: 0.95rem; }

        .progress-container { width: 100%; display: flex; flex-direction: column; gap: 8px; }
        .time-row { display: flex; justify-content: space-between; font-size: 0.8rem; color: rgba(255,255,255,0.5); font-weight: 600; }
        .progress-bar { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; }
        .progress-fill { width: 0%; height: 100%; background: #fff; border-radius: 3px; box-shadow: 0 0 15px rgba(255,255,255,0.4); }

        #signature { position: absolute; top: 50px; color: rgba(255,255,255,0.3); font-size: 0.8rem; letter-spacing: 4px; text-transform: uppercase; font-weight: 600; }

        .red-text { color: #ff3b30 !important; text-shadow: 0 0 25px rgba(255, 59, 48, 0.5); font-weight: 600; }

        /* Standard Transitions */
        .relapse-entry { animation: blurFadeIn 1.5s forwards; }
        .relapse-exit { animation: blurFadeOut 0.8s forwards; }
        .relapse-exit-final { animation: blurFadeOut 2s forwards; }
        @keyframes blurFadeIn { 0% { opacity: 0; filter: blur(20px); transform: scale(0.9); } 100% { opacity: 1; filter: blur(0px); transform: scale(1); } }
        @keyframes blurFadeOut { 0% { opacity: 1; filter: blur(0px); } 100% { opacity: 0; filter: blur(30px); } }

        @media (max-width: 400px) {
            #calc-container { border-radius: 0; width: 100vw; height: 100vh; padding-bottom: 60px; display: flex; flex-direction: column; justify-content: flex-end; background: transparent; border: none; }
        }
    </style>
</head>
<body>

    <div class="bg-mesh">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <audio id="bg-music" preload="auto">
        <source src="bulong.mp3" type="audio/mpeg">
    </audio>

    <div id="calc-container">
        <div id="display">0</div>
        <div class="button-layout">
            <button class="func" onclick="clearDisplay(event)">AC</button>
            <button class="func" onclick="appendNum('(', event)">(</button>
            <button class="func" onclick="appendNum(')', event)">)</button>
            <button class="op" onclick="appendNum('/', event)">÷</button>
            
            <button onclick="appendNum('7', event)">7</button>
            <button onclick="appendNum('8', event)">8</button>
            <button onclick="appendNum('9', event)">9</button>
            <button class="op" onclick="appendNum('*', event)">×</button>
            
            <button onclick="appendNum('4', event)">4</button>
            <button onclick="appendNum('5', event)">5</button>
            <button onclick="appendNum('6', event)">6</button>
            <button class="op" onclick="appendNum('-', event)">−</button>
            
            <button onclick="appendNum('1', event)">1</button>
            <button onclick="appendNum('2', event)">2</button>
            <button onclick="appendNum('3', event)">3</button>
            <button class="op" onclick="appendNum('+', event)">+</button>
            
            <button class="oval" onclick="appendNum('0', event)">0</button>
            <button onclick="appendNum('.', event)">.</button>
            <button class="op" onclick="startSequence(event)">=</button>
        </div>
    </div>

    <div id="void-overlay">
        <video id="bg-video" loop playsinline muted>
            <source src="video.mp4" type="video/mp4">
        </video>

        <div id="signature">MADE BY MATT AT JEC</div>
        
        <div id="zoom-wrapper">
            <div id="void-text"></div>
        </div>

        <div id="music-gui">
            <div class="gui-header">
                <div class="album-art"></div> 
                <div class="track-details">
                    <div class="track-title">Bulong</div>
                    <div class="track-artist">December Avenue</div>
                </div>
            </div>
            <div class="progress-container">
                <div class="time-row">
                    <span id="curr-time">0:00</span>
                    <span id="rem-time">-0:00</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- SECURITY ---
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'j') { location.reload(); return; }
            if (e.key === 'F12' || (e.ctrlKey && (e.key === 'u' || e.key === 's' || e.key === 'i'))) e.preventDefault();
        });

        const display = document.getElementById('display');
        const calcContainer = document.getElementById('calc-container');
        const overlay = document.getElementById('void-overlay');
        const textField = document.getElementById('void-text');
        const bgMusic = document.getElementById('bg-music');
        const bgVideo = document.getElementById('bg-video');
        const progressFill = document.getElementById('progress-fill');

        let isTransitioning = false;
        let currentStep = 0;

        const messages = [
            { text: "Ako'y alipin ng pag-ibig mo", duration: 6000 },
            { text: "Handang ibigin ang <span class='red-text'>isang tulad mo</span>", duration: 6500 },
            { text: "Hanggat ang <span class='red-text'>Puso</span> mo'y", duration: 2600 },
            { text: "<span class='red-text'>Sa akin lang</span>", duration: 1400 },
            { text: "Hindi kana", duration: 1400 },
            { text: "<span class='red-text'>Malilinlang</span>", duration: 1400 },
            { text: "Ikaw ang <span class='red-text'>ilaw</span> sa <span class='red-text'>dilim</span>", duration: 2700 },
            { text: "<span class='red-text'>At ang liwanag</span>", duration: 1700 },
            { text: "<span class='red-text'>Ng mga bituin</span>", duration: 5800 }
        ];

        function formatTime(s) {
            const min = Math.floor(s / 60);
            const sec = Math.floor(s % 60);
            return `${min}:${sec < 10 ? '0' : ''}${sec}`;
        }

        bgMusic.addEventListener('timeupdate', () => {
            if (!bgMusic.duration) return;
            const progress = (bgMusic.currentTime / bgMusic.duration) * 100;
            progressFill.style.width = progress + '%';
            document.getElementById('curr-time').innerText = formatTime(bgMusic.currentTime);
            document.getElementById('rem-time').innerText = "-" + formatTime(bgMusic.duration - bgMusic.currentTime);
        });

        function appendNum(n, e) {
            e.stopPropagation();
            if (["Error", "Calculating...", "Nagkamali ba ako?"].includes(display.innerText)) {
                display.innerText = "";
                display.style.color = "#fff";
            }
            if (display.innerText === "0" && n !== ".") display.innerText = n;
            else display.innerText += n;
            
            const len = display.innerText.length;
            if (len > 12) display.style.fontSize = "2.2rem";
            else if (len > 8) display.style.fontSize = "3.5rem";
            else display.style.fontSize = "5rem";
        }

        function clearDisplay(e) {
            e.stopPropagation();
            display.innerText = "0";
            display.style.fontSize = "5rem";
            display.style.color = "#fff";
        }

        function startSequence(e) {
            e.stopPropagation();
            if (isTransitioning) return;

            let val = display.innerText.replace(/÷/g, '/').replace(/×/g, '*');
            try { eval(val); } catch { display.innerText = "Error"; display.style.color = "#ff3b30"; return; }

            isTransitioning = true;
            display.innerText = "Calculating...";
            display.style.fontSize = "2.5rem";
            display.style.color = "rgba(255,255,255,0.5)";

            setTimeout(() => {
                display.innerText = "Nagkamali ba ako?";
                display.style.color = "#ff3b30";

                // Play Video & Music (Starts at 183s)
                bgVideo.play();
                bgMusic.currentTime = 183; 
                bgMusic.volume = 0;
                bgMusic.play();
                
                let vol = 0;
                const fIn = setInterval(() => {
                    if (vol < 1) { vol += 0.05; bgMusic.volume = Math.min(vol, 1); }
                    else clearInterval(fIn);
                }, 50);

                calcContainer.style.opacity = "0";
                calcContainer.style.transform = "scale(0.8) translateY(100px)";

                setTimeout(() => {
                    calcContainer.style.display = "none";
                    overlay.style.display = "flex";
                    
                    // --- DYNAMIC ZOOM FOR START ---
                    textField.innerHTML = "Nagkamali ba ako?";
                    textField.className = "zoom-impact"; 

                    setTimeout(() => { 
                        document.getElementById('music-gui').style.opacity = "1"; 
                    }, 500);

                    // Wait 2 seconds for the zoom to settle before starting lyrics
                    setTimeout(() => {
                        runLyrics();
                    }, 2000);

                }, 1200);
            }, 2000);
        }

        function runLyrics() {
            if (currentStep < messages.length) {
                textField.innerHTML = messages[currentStep].text;
                textField.className = "relapse-entry";
                
                setTimeout(() => {
                    const isLast = currentStep === messages.length - 1;
                    textField.className = isLast ? "relapse-exit-final" : "relapse-exit";
                    setTimeout(() => {
                        currentStep++;
                        if (currentStep < messages.length) runLyrics();
                        else {
                            textField.innerHTML = "<span class='red-text'>Aray mo Pakak!</span>";
                            textField.className = "relapse-entry";
                        }
                    }, isLast ? 2000 : 800);
                }, messages[currentStep].duration);
            }
        }
    </script>
</body>
</html>
