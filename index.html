<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; outline: none; }
        body { background-color: #050505; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; user-select: none; }

        .bg-mesh { position: fixed; top: -50vh; left: -50vw; width: 200vw; height: 200vh; z-index: -1; background: #050505; overflow: hidden; animation: spinMesh 40s linear infinite; }
        @keyframes spinMesh { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .orb { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.6; animation: pulseOrb 10s infinite alternate; }
        .orb-1 { width: 60vw; height: 60vw; background: #1c2b59; top: 20%; left: 20%; }
        .orb-2 { width: 50vw; height: 50vw; background: #4a154b; bottom: 20%; right: 20%; animation-delay: -3s; }
        .orb-3 { width: 45vw; height: 45vw; background: #8a3a0e; top: 40%; left: 40%; animation-delay: -6s; }
        @keyframes pulseOrb { 0% { transform: scale(1); opacity: 0.5; } 100% { transform: scale(1.2); opacity: 0.8; } }

        #calc-container {
            background: rgba(20, 20, 25, 0.4); backdrop-filter: blur(50px); -webkit-backdrop-filter: blur(50px);
            padding: 35px 22px 40px 22px; border-radius: 48px; border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 40px 80px rgba(0,0,0,0.8), inset 0 1px 1px rgba(255,255,255,0.2), inset 0 -1px 1px rgba(0,0,0,0.5);
            width: 360px; transition: opacity 1.5s cubic-bezier(0.16, 1, 0.3, 1), transform 1.5s ease; z-index: 10;
        }

        #display {
            width: 100%; height: 110px; color: #ffffff; font-size: 4.8rem; font-weight: 200; text-align: right;
            padding: 0 10px; margin-bottom: 20px; display: flex; align-items: flex-end; justify-content: flex-end;
            overflow: hidden; letter-spacing: -2px; text-shadow: 0 2px 10px rgba(0,0,0,0.3); white-space: nowrap; transition: font-size 0.2s ease; 
        }

        .button-layout { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
        button { border: none; height: 72px; width: 100%; border-radius: 36px; font-size: 1.8rem; font-weight: 400; cursor: pointer; transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1); display: flex; justify-content: center; align-items: center; background: rgba(255, 255, 255, 0.08); color: #eeeeee; border: 1px solid rgba(255, 255, 255, 0.03); box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        button:active { transform: scale(0.92); background: rgba(255, 255, 255, 0.2); }
        .func { background: rgba(255, 255, 255, 0.15); color: #ffffff; font-size: 1.5rem; font-weight: 500; }
        .func:active { background: rgba(255, 255, 255, 0.3); }
        .op { background: #FF9F0A; color: #fff; font-size: 2.2rem; font-weight: 500; border: 1px solid rgba(255, 159, 10, 0.5); box-shadow: 0 8px 20px rgba(255, 159, 10, 0.3); }
        .op:active { background: #d98505; box-shadow: 0 4px 10px rgba(255, 159, 10, 0.2); }
        .oval { grid-column: span 2; width: 100%; border-radius: 36px; justify-content: flex-start; padding-left: 28px; }

        #void-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5); display: none; flex-direction: column;
            justify-content: center; align-items: center; z-index: 999;
        }

        #bg-video {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: -1; filter: blur(15px) brightness(0.4); 
        }

        .no-click { pointer-events: none; }
        #zoom-wrapper { width: 100%; display: flex; justify-content: center; align-items: center; margin-bottom: 80px; z-index: 2; }
        #void-text { font-size: 2.2rem; font-weight: 500; text-align: center; width: 90%; opacity: 0; line-height: 1.4; color: #ffffff; display: inline-block; letter-spacing: -0.5px; }

        #music-gui {
            position: absolute; bottom: 40px; width: 85%; max-width: 400px;
            display: flex; flex-direction: column; gap: 15px; opacity: 0; transition: opacity 2s ease; z-index: 2;
        }
        .gui-header { display: flex; align-items: center; gap: 15px; }
        .album-art {
            width: 55px; height: 55px; border-radius: 50%;
            background: url('https://upload.wikimedia.org/wikipedia/en/3/36/December_Avenue_-_December_Avenue.jpg') center/cover;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5); border: 2px solid rgba(255,255,255,0.1); animation: spinArt 4s linear infinite;
        }
        .album-art::after {
            content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 12px; height: 12px; background: #000; border-radius: 50%; border: 1px solid rgba(255,255,255,0.2);
        }
        @keyframes spinArt { 100% { transform: rotate(360deg); } }

        .track-details { display: flex; flex-direction: column; }
        .track-title { color: #fff; font-weight: 600; font-size: 1.1rem; letter-spacing: 0.5px; }
        .track-artist { color: #a0a0ab; font-size: 0.9rem; font-weight: 400; }

        .progress-container { width: 100%; display: flex; flex-direction: column; gap: 6px; }
        .time-row { display: flex; justify-content: space-between; font-size: 0.75rem; color: #a0a0ab; font-weight: 500; }
        .progress-bar { width: 100%; height: 5px; background: rgba(255,255,255,0.15); border-radius: 3px; overflow: hidden; }
        .progress-fill { width: 0%; height: 100%; background: #fff; box-shadow: 0 0 10px rgba(255,255,255,0.5); }
        
        #creator-name { position: absolute; top: 40px; color: rgba(255, 255, 255, 0.5); font-size: 0.9rem; font-weight: 500; letter-spacing: 3px; text-transform: uppercase; z-index: 2; }
        .red-text { color: #ff3b30 !important; text-shadow: 0 0 20px rgba(255, 59, 48, 0.4); font-weight: 600; }

        .zoom-layer { animation: continuousZoom 15s linear forwards; }
        .relapse-entry { animation: blurFadeIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .relapse-exit { animation: blurFadeOut 0.6s cubic-bezier(0.7, 0, 0.84, 0) forwards; }
        .relapse-exit-final { animation: blurFadeOut 1.5s cubic-bezier(0.7, 0, 0.84, 0) forwards; }
        @keyframes blurFadeIn { 0% { opacity: 0; filter: blur(20px); transform: scale(0.95); } 100% { opacity: 1; filter: blur(0px); transform: scale(1); } }
        @keyframes continuousZoom { 0% { transform: scale(1); } 100% { transform: scale(1.15); } }
        @keyframes blurFadeOut { 0% { opacity: 1; filter: blur(0px); transform: scale(1); } 100% { opacity: 0; filter: blur(20px); transform: scale(1.05); } }
        .plot-twist-fade-in { animation: simpleFadeIn 4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes simpleFadeIn { 0% { opacity: 0; transform: scale(0.9); filter: blur(10px); } 100% { opacity: 1; transform: scale(1); filter: blur(0px); } }

        @media (max-width: 400px) {
            #calc-container { box-shadow: none; width: 100vw; height: 100vh; border-radius: 0; border: none; padding: 40px 20px 50px 20px; display: flex; flex-direction: column; justify-content: flex-end; background: transparent; backdrop-filter: none; -webkit-backdrop-filter: none; }
            #display { font-size: 5.5rem; margin-bottom: 30px;}
        }
    </style>
</head>
<body>

    <div class="bg-mesh">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div id="calc-container">
        <div id="display">0</div>
        <div class="button-layout">
            <button class="func" onclick="clearDisplay(event)">AC</button>
            <button class="func" onclick="appendNum('(', event)">(</button>
            <button class="func" onclick="appendNum(')', event)">)</button>
            <button class="op" onclick="appendNum('/', event)">÷</button>
            
            <button class="num" onclick="appendNum('7', event)">7</button>
            <button class="num" onclick="appendNum('8', event)">8</button>
            <button class="num" onclick="appendNum('9', event)">9</button>
            <button class="op" onclick="appendNum('*', event)">×</button>
            
            <button class="num" onclick="appendNum('4', event)">4</button>
            <button class="num" onclick="appendNum('5', event)">5</button>
            <button class="num" onclick="appendNum('6', event)">6</button>
            <button class="op" onclick="appendNum('-', event)">−</button>
            
            <button class="num" onclick="appendNum('1', event)">1</button>
            <button class="num" onclick="appendNum('2', event)">2</button>
            <button class="num" onclick="appendNum('3', event)">3</button>
            <button class="op" onclick="appendNum('+', event)">+</button>
            
            <button class="num oval" onclick="appendNum('0', event)">0</button>
            <button class="num" onclick="appendNum('.', event)">.</button>
            <button class="op" onclick="startSequence(event)">=</button>
        </div>
    </div>

    <div id="void-overlay">
        <video id="bg-media" loop playsinline>
            <source src="video.mp4" type="video/mp4">
        </video>

        <div id="creator-name">MADE BY MATT AT JEC</div>
        
        <div id="zoom-wrapper">
            <div id="void-text"></div>
        </div>

        <div id="music-gui">
            <div class="gui-header">
                <div class="album-art"></div> 
                <div class="track-details">
                    <div class="track-title">Bulong</div>
                    <div class="track-artist">December Avenue</div>
                </div>
            </div>
            <div class="progress-container">
                <div class="time-row">
                    <span id="current-time">0:00</span>
                    <span id="remaining-time">-0:00</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- SECURITY WALL ---
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'j') { location.reload(); return; }
            if (e.key === 'F12' || e.keyCode === 123) { e.preventDefault(); return; }
            if (e.ctrlKey || e.metaKey) {
                const k = e.key.toLowerCase();
                if (k === 'u' || k === 's' || k === 'p' || (e.shiftKey && k === 'i') || (e.shiftKey && k === 'c')) {
                    e.preventDefault(); return;
                }
            }
        });

        const display = document.getElementById('display');
        const calcContainer = document.getElementById('calc-container');
        const overlay = document.getElementById('void-overlay');
        const textField = document.getElementById('void-text');
        const zoomWrapper = document.getElementById('zoom-wrapper');
        
        const bgMedia = document.getElementById('bg-media'); // Video acts as both visual & audio
        const progressFill = document.getElementById('progress-fill');
        const currentTimeEl = document.getElementById('current-time');
        const remainingTimeEl = document.getElementById('remaining-time');
        const musicGui = document.getElementById('music-gui');

        let appState = "CALC"; 
        let currentStep = 0;
        let isTransitioning = false;

        const messages = [
            { text: "Ako'y alipin ng pag-ibig mo", duration: 6000 },
            { text: "Handang ibigin ang <span class='red-text'>isang tulad mo</span>", duration: 6500 },
            { text: "Hanggat ang <span class='red-text'>Puso</span> mo'y", duration: 2600 },
            { text: "<span class='red-text'>Sa akin lang</span>", duration: 1400 },
            { text: "Hindi kana", duration: 1400 },
            { text: "<span class='red-text'>Malilinlang</span>", duration: 1400 },
            { text: "Ikaw ang <span class='red-text'>ilaw</span> sa <span class='red-text'>dilim</span>", duration: 2700 },
            { text: "<span class='red-text'>At ang liwanag</span>", duration: 1700 },
            { text: "<span class='red-text'>Ng mga bituin</span>", duration: 5800 }
        ];

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        // GUI Timestamps reading directly from the video file
        bgMedia.addEventListener('timeupdate', () => {
            if (bgMedia.duration) {
                const current = bgMedia.currentTime;
                const duration = bgMedia.duration;
                progressFill.style.width = ((current / duration) * 100) + '%';
                currentTimeEl.innerText = formatTime(current);
                remainingTimeEl.innerText = "-" + formatTime(duration - current);
            }
        });

        function updateFontSize() {
            if (isTransitioning) return;
            const len = display.innerText.length;
            if (len > 14) display.style.fontSize = "1.8rem";
            else if (len > 11) display.style.fontSize = "2.4rem";
            else if (len > 8) display.style.fontSize = "3.2rem";
            else display.style.fontSize = "4.8rem";
        }

        function appendNum(char, event) {
            event.stopPropagation();
            if (display.innerText === "Error" || display.innerText === "Nagkamali ba ako?" || display.innerText === "Calculating...") {
                display.innerText = "";
                display.style.fontWeight = "200";
                display.style.color = "#fff";
            }
            if (display.innerText === '0' && char !== '.') display.innerText = char;
            else display.innerText += char;
            updateFontSize();
        }

        function clearDisplay(event) {
            event.stopPropagation();
            if(isTransitioning) return;
            display.innerText = '0';
            display.style.fontWeight = "200";
            display.style.color = "#fff";
            updateFontSize();
            appState = "CALC";
        }

        function startSequence(event) {
            event.stopPropagation();
            if (isTransitioning || display.innerText === "Error") return;

            let userInput = display.innerText.replace(/\s/g, ''); 

            // SECRET TRIGGER
            if (userInput === "1+1") {
                isTransitioning = true;
                display.innerText = "Calculating...";
                display.style.fontSize = "2.8rem"; 
                display.style.fontWeight = "300";
                display.style.color = "#888890";

                setTimeout(() => {
                    display.innerText = "Nagkamali ba ako?"; 
                    display.style.fontSize = "2.4rem";
                    display.style.fontWeight = "400";
                    display.style.color = "#ff3b30";

                    // Play Video/Audio combined
                    bgMedia.volume = 0;
                    bgMedia.currentTime = 0; // Starts the reel from the beginning
                    
                    bgMedia.play().then(() => {
                        let vol = 0;
                        const fadeInInterval = setInterval(() => {
                            if (vol < 1) {
                                vol += 0.05; 
                                bgMedia.volume = Math.min(vol, 1);
                            } else clearInterval(fadeInInterval);
                        }, 50); 
                    }).catch(e => console.log("Autoplay blocked by browser."));

                    calcContainer.style.transform = 'scale(0.9) translateY(50px)';
                    calcContainer.style.opacity = '0';
                    
                    setTimeout(() => {
                        calcContainer.style.display = 'none';
                        overlay.style.display = 'flex';
                        overlay.classList.add('no-click');
                        
                        setTimeout(() => { musicGui.style.opacity = '1'; }, 500);
                        
                        setTimeout(() => {
                            appState = "RELAPSING";
                            runAutomatedLyrics();
                        }, 3000);
                    }, 1500); 

                }, 2000);
            } 
            else {
                try {
                    let result = eval(userInput);
                    if (result === Infinity || isNaN(result)) throw new Error("Math Error");
                    display.innerText = result;
                    updateFontSize();
                } catch (e) {
                    display.innerText = "Error";
                    display.style.color = "#ff3b30";
                    display.style.fontWeight = "400";
                    display.style.fontSize = "4.8rem";
                }
            }
        }

        function runAutomatedLyrics() {
            if (currentStep < messages.length) {
                renderMessage(messages[currentStep].text);
                setTimeout(() => {
                    const isFinal = currentStep === messages.length - 1;
                    textField.classList.remove('relapse-entry');
                    textField.classList.add(isFinal ? 'relapse-exit-final' : 'relapse-exit');

                    setTimeout(() => {
                        currentStep++;
                        if (currentStep < messages.length) runAutomatedLyrics();
                        else showPlotTwist();
                    }, isFinal ? 1200 : 600); 
                }, messages[currentStep].duration);
            }
        }

        function renderMessage(content) {
            zoomWrapper.classList.remove('zoom-layer');
            void zoomWrapper.offsetWidth; 
            zoomWrapper.classList.add('zoom-layer');

            textField.classList.remove('relapse-exit', 'relapse-entry', 'relapse-exit-final', 'plot-twist-fade-in');
            textField.innerHTML = content;
            void textField.offsetWidth; 
            textField.classList.add('relapse-entry');
        }

        function showPlotTwist() {
            zoomWrapper.classList.remove('zoom-layer');
            textField.classList.remove('relapse-exit', 'relapse-entry', 'relapse-exit-final');
            textField.innerHTML = "<span class='red-text'>Aray mo Pakak!</span>";
            void textField.offsetWidth;
            textField.classList.add('plot-twist-fade-in'); 
        }
    </script>
</body>
</html>
