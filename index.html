<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }

        body {
            /* Cinematic deep background with subtle lighting */
            background-color: #050505;
            background-image: radial-gradient(circle at 50% -20%, #1a1a24 0%, #050505 80%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            user-select: none;
        }

        /* The Premium Glassmorphism Container */
        #calc-container {
            background: rgba(30, 30, 35, 0.4);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            padding: 35px 22px 40px 22px;
            border-radius: 48px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 
                0 40px 80px rgba(0,0,0,0.8), 
                inset 0 1px 1px rgba(255,255,255,0.15),
                inset 0 -1px 1px rgba(0,0,0,0.5);
            width: 360px;
            transition: opacity 1.5s cubic-bezier(0.16, 1, 0.3, 1); 
        }

        #display {
            width: 100%;
            height: 110px;
            color: #ffffff;
            font-size: 4.8rem; 
            font-weight: 200; /* Ultra-light premium font weight */
            text-align: right;
            padding: 0 10px;
            margin-bottom: 20px;
            display: flex;
            align-items: flex-end;
            justify-content: flex-end;
            overflow: hidden;
            letter-spacing: -2.5px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .button-layout {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
        }

        button {
            border: none;
            height: 72px;
            width: 100%;
            border-radius: 36px;
            font-size: 1.8rem;
            font-weight: 400;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            justify-content: center;
            align-items: center;
            /* Premium translucent buttons */
            background: rgba(255, 255, 255, 0.08);
            color: #eeeeee;
            border: 1px solid rgba(255, 255, 255, 0.03);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        /* Micro-interaction animations */
        button:active { 
            transform: scale(0.92); 
            background: rgba(255, 255, 255, 0.2);
        }

        /* Top row function buttons */
        .func { 
            background: rgba(255, 255, 255, 0.15); 
            color: #ffffff; 
            font-size: 1.5rem; 
            font-weight: 500;
        }
        .func:active { background: rgba(255, 255, 255, 0.3); }

        /* Operator buttons (Apple Vibrant Orange) */
        .op { 
            background: #FF9F0A; 
            color: #fff; 
            font-size: 2.2rem; 
            font-weight: 500;
            border: 1px solid rgba(255, 159, 10, 0.5);
            box-shadow: 0 8px 20px rgba(255, 159, 10, 0.3);
        }
        .op:active { 
            background: #d98505; 
            box-shadow: 0 4px 10px rgba(255, 159, 10, 0.2);
        }

        .oval { 
            grid-column: span 2; 
            width: 100%; 
            border-radius: 36px; 
            justify-content: flex-start;
            padding-left: 28px;
        }

        /* --- OVERLAY & CINEMATICS --- */
        #void-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .no-click { pointer-events: none; }

        #zoom-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #void-text {
            font-size: 2.2rem;
            font-weight: 500;
            text-align: center;
            width: 90%;
            opacity: 0;
            line-height: 1.4;
            color: #ffffff;
            display: inline-block;
            letter-spacing: -0.5px;
        }

        #matt-name {
            position: absolute;
            bottom: 25%;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.5);
            opacity: 0; 
            font-size: 1rem;
            font-weight: 400;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .name-fade-in { animation: mattFade 2s ease forwards; }

        @keyframes mattFade {
            0% { opacity: 0; filter: blur(10px); }
            100% { opacity: 1; filter: blur(0px); }
        }

        .red-text { 
            color: #ff3b30 !important; 
            text-shadow: 0 0 20px rgba(255, 59, 48, 0.4); 
            font-weight: 600;
        }

        .zoom-layer { animation: continuousZoom 15s linear forwards; }
        .relapse-entry { animation: blurFadeIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .relapse-exit { animation: blurFadeOut 0.6s cubic-bezier(0.7, 0, 0.84, 0) forwards; }
        .relapse-exit-final { animation: blurFadeOut 1.5s cubic-bezier(0.7, 0, 0.84, 0) forwards; }

        @keyframes blurFadeIn {
            0% { opacity: 0; filter: blur(20px); transform: scale(0.95); }
            100% { opacity: 1; filter: blur(0px); transform: scale(1); }
        }

        @keyframes continuousZoom {
            0% { transform: scale(1); }
            100% { transform: scale(1.15); }
        }

        @keyframes blurFadeOut {
            0% { opacity: 1; filter: blur(0px); transform: scale(1); }
            100% { opacity: 0; filter: blur(20px); transform: scale(1.05); }
        }

        .plot-twist-fade-in { animation: simpleFadeIn 4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        @keyframes simpleFadeIn {
            0% { opacity: 0; transform: scale(0.9); filter: blur(10px); }
            100% { opacity: 1; transform: scale(1); filter: blur(0px); }
        }

        @media (max-width: 400px) {
            #calc-container { 
                box-shadow: none; 
                width: 100vw; 
                height: 100vh; 
                border-radius: 0; 
                border: none;
                padding: 40px 20px 50px 20px; 
                display: flex; 
                flex-direction: column; 
                justify-content: flex-end;
                background: #000;
                backdrop-filter: none;
            }
            #display { font-size: 5.5rem; margin-bottom: 30px;}
        }
    </style>
</head>
<body>

    <audio id="bg-music" preload="auto">
        <source src="bulong.mp3" type="audio/mpeg">
    </audio>

    <div id="calc-container">
        <div id="display">0</div>
        <div class="button-layout">
            <button class="func" onclick="clearDisplay(event)">AC</button>
            <button class="func" onclick="appendNum('(', event)">(</button>
            <button class="func" onclick="appendNum(')', event)">)</button>
            <button class="op" onclick="appendNum('/', event)">÷</button>
            
            <button class="num" onclick="appendNum('7', event)">7</button>
            <button class="num" onclick="appendNum('8', event)">8</button>
            <button class="num" onclick="appendNum('9', event)">9</button>
            <button class="op" onclick="appendNum('*', event)">×</button>
            
            <button class="num" onclick="appendNum('4', event)">4</button>
            <button class="num" onclick="appendNum('5', event)">5</button>
            <button class="num" onclick="appendNum('6', event)">6</button>
            <button class="op" onclick="appendNum('-', event)">−</button>
            
            <button class="num" onclick="appendNum('1', event)">1</button>
            <button class="num" onclick="appendNum('2', event)">2</button>
            <button class="num" onclick="appendNum('3', event)">3</button>
            <button class="op" onclick="appendNum('+', event)">+</button>
            
            <button class="num oval" onclick="appendNum('0', event)">0</button>
            <button class="num" onclick="appendNum('.', event)">.</button>
            <button class="op" onclick="startSequence(event)">=</button>
        </div>
    </div>

    <div id="void-overlay">
        <div id="zoom-wrapper">
            <div id="void-text"></div>
        </div>
        <div id="matt-name">MATT</div>
    </div>

    <script>
        // --- ANTI-SNOOP SECURITY WALL ---
        document.addEventListener('contextmenu', event => event.preventDefault());

        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'j') {
                location.reload(); 
                return; 
            }
            if (e.key === 'F12' || e.keyCode === 123) {
                e.preventDefault(); return;
            }
            if (e.ctrlKey || e.metaKey) {
                const k = e.key.toLowerCase();
                if (k === 'u' || k === 's' || k === 'p' || (e.shiftKey && k === 'i') || (e.shiftKey && k === 'c')) {
                    e.preventDefault(); return;
                }
            }
        });
        // --- END SECURITY WALL ---

        const display = document.getElementById('display');
        const calcContainer = document.getElementById('calc-container');
        const overlay = document.getElementById('void-overlay');
        const textField = document.getElementById('void-text');
        const zoomWrapper = document.getElementById('zoom-wrapper');
        const mattName = document.getElementById('matt-name');
        const bgMusic = document.getElementById('bg-music');

        let appState = "CALC"; 
        let currentStep = 0;
        let isTransitioning = false;

        // READABLE LYRICS ARRAY
        const messages = [
            { text: "Ako'y alipin ng pag-ibig mo", duration: 6000 },
            { text: "Handang ibigin ang <span class='red-text'>isang tulad mo</span>", duration: 6500 },
            { text: "Hanggat ang <span class='red-text'>Puso</span> mo'y", duration: 2600 },
            { text: "<span class='red-text'>Sa akin lang</span>", duration: 1400 },
            { text: "Hindi kana", duration: 1400 },
            { text: "<span class='red-text'>Malilinlang</span>", duration: 1400 },
            { text: "Ikaw ang <span class='red-text'>ilaw</span> sa <span class='red-text'>dilim</span>", duration: 2700 },
            { text: "<span class='red-text'>At ang liwanag</span>", duration: 1700 },
            { text: "<span class='red-text'>Ng mga bituin</span>", duration: 5800 }
        ];

        function appendNum(char, event) {
            event.stopPropagation();
            if (display.innerText === "Error" || display.innerText === "Nagkamali ba ako?" || display.innerText === "Calculating...") {
                display.innerText = "";
                display.style.fontSize = "4.8rem";
                display.style.fontWeight = "200";
                display.style.color = "#fff";
            }
            if (display.innerText === '0' && char !== '.') {
                display.innerText = char;
            } else {
                display.innerText += char;
            }
        }

        function clearDisplay(event) {
            event.stopPropagation();
            if(isTransitioning) return;
            display.innerText = '0';
            display.style.fontSize = "4.8rem";
            display.style.fontWeight = "200";
            display.style.color = "#fff";
            appState = "CALC";
        }

        function startSequence(event) {
            event.stopPropagation();
            if (isTransitioning) return;
            if (display.innerText === "Error") return;

            let userInput = display.innerText;
            let isValid = false;

            try {
                if (!userInput || userInput === "0") throw new Error("Empty");
                eval(userInput);
                if (['+', '-', '*', '/'].includes(userInput.slice(-1))) {
                    throw new Error("Trailing operator");
                }
                isValid = true; 
            } catch (e) {
                isValid = false;
            }

            if (!isValid) {
                display.innerText = "Error";
                display.style.color = "#ff3b30";
                display.style.fontWeight = "400";
                return; 
            }

            // --- THE FAKE CALCULATION DELAY ---
            isTransitioning = true;
            display.innerText = "Calculating...";
            display.style.fontSize = "2.8rem"; 
            display.style.fontWeight = "300";
            display.style.color = "#888890";

            setTimeout(() => {
                // The Plot Twist kicks in here
                display.innerText = "Nagkamali ba ako?"; 
                display.style.fontSize = "2.4rem";
                display.style.fontWeight = "400";
                display.style.color = "#ff3b30";

                // Prime Audio (Required for mobile browsers)
                bgMusic.muted = true;
                bgMusic.play().then(() => {
                    bgMusic.pause();
                    bgMusic.muted = false;
                    startAudioFade();
                }).catch(e => {
                    bgMusic.muted = false;
                    startAudioFade();
                });

                function startAudioFade() {
                    bgMusic.currentTime = 183;
                    bgMusic.volume = 0;
                    bgMusic.play();

                    let vol = 0;
                    const fadeInInterval = setInterval(() => {
                        if (vol < 1) {
                            vol += 0.05; 
                            bgMusic.volume = Math.min(vol, 1);
                        } else {
                            clearInterval(fadeInInterval);
                        }
                    }, 50); 
                }

                // Fade out the calculator gently
                calcContainer.style.opacity = '0';
                
                setTimeout(() => {
                    calcContainer.style.display = 'none';
                    overlay.style.display = 'flex';
                    overlay.classList.add('no-click');
                    mattName.classList.add('name-fade-in');
                    
                    // Wait before starting the lyrics text
                    setTimeout(() => {
                        appState = "RELAPSING";
                        runAutomatedLyrics();
                    }, 3000);
                }, 1500); 

            }, 2000); // Waits exactly 2 seconds pretending to calculate!
        }

        function runAutomatedLyrics() {
            if (currentStep < messages.length) {
                renderMessage(messages[currentStep].text);
                
                setTimeout(() => {
                    const isFinal = currentStep === messages.length - 1;
                    textField.classList.remove('relapse-entry');
                    textField.classList.add(isFinal ? 'relapse-exit-final' : 'relapse-exit');

                    const transitionDelay = isFinal ? 1200 : 600;

                    setTimeout(() => {
                        currentStep++;
                        if (currentStep < messages.length) {
                            runAutomatedLyrics();
                        } else {
                            showPlotTwist();
                        }
                    }, transitionDelay); 

                }, messages[currentStep].duration);
            }
        }

        function renderMessage(content) {
            zoomWrapper.classList.remove('zoom-layer');
            void zoomWrapper.offsetWidth; 
            zoomWrapper.classList.add('zoom-layer');

            textField.classList.remove('relapse-exit', 'relapse-entry', 'relapse-exit-final', 'plot-twist-fade-in');
            textField.innerHTML = content;
            void textField.offsetWidth; 
            textField.classList.add('relapse-entry');
        }

        function showPlotTwist() {
            zoomWrapper.classList.remove('zoom-layer');
            textField.classList.remove('relapse-exit', 'relapse-entry', 'relapse-exit-final');
            textField.innerHTML = "<span class='red-text'>Aray mo Pakak!</span>";
            void textField.offsetWidth;
            textField.classList.add('plot-twist-fade-in'); 
        }
    </script>
</body>
</html>
